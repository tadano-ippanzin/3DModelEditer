<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3.875次元モデルエディタ Pro (100機能版)</title>
  <style>
    :root { --bg:#111318; --panel:rgba(20,23,31,0.92); --border:rgba(255,255,255,0.12); --accent:#00e588; --accent2:#3b82f6; --danger:#ef4444; --text:#e5e7eb; --muted:#9ca3af; }
    * { box-sizing: border-box; }
    body { margin:0; overflow:hidden; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; touch-action:none; user-select:none; font-size:12px; }
    #canvas-container { width:100vw; height:100vh; display:block; }
    .panel { position:absolute; top:10px; left:10px; width:302px; max-height:calc(100vh - 86px); background:var(--panel); backdrop-filter:blur(10px); border:1px solid var(--border); border-radius:10px; display:flex; flex-direction:column; z-index:20; box-shadow:0 8px 30px rgba(0,0,0,0.5); transition:transform .2s,opacity .2s; }
    .panel.collapsed { transform:translateX(-324px); opacity:0; pointer-events:none; }
    .panel-header { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:8px 10px; border-bottom:1px solid var(--border); font-weight:700; }
    .tabs { display:grid; grid-template-columns:repeat(5,1fr); border-bottom:1px solid var(--border); }
    .tab-btn { background:transparent; color:var(--muted); border:none; padding:7px 2px; font-size:11px; cursor:pointer; border-bottom:2px solid transparent; border-radius:0; }
    .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); background:rgba(0,229,136,0.08); font-weight:700; }
    .panel-body { padding:9px; overflow-y:auto; flex:1; }
    .tab-pane { display:none; flex-direction:column; gap:8px; }
    .tab-pane.active { display:flex; }
    .panel-body::-webkit-scrollbar { width:5px; }
    .panel-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); border-radius:3px; }
    .sec { border:1px solid var(--border); border-radius:7px; padding:8px; background:rgba(255,255,255,0.02); }
    .sec-title { font-size:10px; font-weight:700; color:var(--muted); margin-bottom:6px; letter-spacing:.4px; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
    .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; }
    .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; }
    .grid-5 { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; }
    .row { display:flex; align-items:center; gap:5px; margin-bottom:5px; }
    .row:last-child { margin-bottom:0; }
    .row label { flex:0 0 66px; color:var(--muted); font-size:11px; }
    button { background:#252a36; color:var(--text); border:1px solid var(--border); padding:5px 7px; border-radius:5px; font-size:11px; cursor:pointer; }
    button:hover { background:#32394a; }
    button.active { background:var(--accent); color:#042b1a; font-weight:700; border-color:var(--accent); }
    button.primary { background:var(--accent2); color:#fff; border-color:var(--accent2); }
    button.danger { background:rgba(239,68,68,0.18); color:#fca5a5; border-color:rgba(239,68,68,0.4); }
    button.danger:hover { background:var(--danger); color:#fff; }
    input[type="text"], input[type="number"], select { width:100%; background:#0c0e13; color:var(--text); border:1px solid var(--border); border-radius:4px; padding:4px 5px; font-size:11px; min-width:0; }
    input[type="range"] { flex:1; accent-color:var(--accent); min-width:0; }
    input[type="color"] { width:32px; height:24px; border:none; background:transparent; cursor:pointer; padding:0; flex-shrink:0; }
    input[type="checkbox"] { accent-color:var(--accent); cursor:pointer; }
    .toolbar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center; gap:4px; max-width:96vw; background:var(--panel); backdrop-filter:blur(10px); padding:6px 8px; border-radius:10px; border:1px solid var(--border); z-index:20; }
    .toolbar button { padding:6px 8px; font-size:11px; }
    .hud { position:absolute; top:10px; right:10px; display:flex; flex-direction:column; align-items:flex-end; gap:6px; z-index:20; }
    .hud-box { background:var(--panel); backdrop-filter:blur(8px); border:1px solid var(--border); padding:6px 10px; border-radius:8px; font-size:11px; text-align:right; line-height:1.45; }
    .outliner { max-height:175px; overflow-y:auto; display:flex; flex-direction:column; gap:3px; }
    .out-item { display:flex; align-items:center; gap:4px; padding:4px 5px; border-radius:4px; background:rgba(255,255,255,0.03); cursor:pointer; border:1px solid transparent; }
    .out-item.selected { background:rgba(0,229,136,0.16); border-color:var(--accent); }
    .out-item .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .out-item button { padding:2px 5px; font-size:10px; }
    .toast { position:absolute; top:14px; left:50%; transform:translateX(-50%); background:rgba(15,23,42,0.94); color:var(--accent); border:1px solid var(--accent); padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600; z-index:50; opacity:0; pointer-events:none; transition:opacity .25s; }
    .toast.show { opacity:1; }
    .modal { position:fixed; inset:0; background:rgba(0,0,0,0.65); display:none; align-items:center; justify-content:center; z-index:60; padding:16px; }
    .modal.open { display:flex; }
    .modal-card { background:#181b24; border:1px solid var(--border); border-radius:10px; max-width:460px; width:100%; max-height:82vh; overflow-y:auto; padding:16px; }
    @media (max-width:640px) { .panel { width:calc(100vw - 20px); max-height:52vh; } .hud-box { display:none; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="toast" class="toast"></div>
  <div class="hud">
    <div style="display:flex;gap:5px;">
      <button id="toggle-panel-btn">☰ パネル</button>
      <button id="help-btn">? 操作</button>
    </div>
    <div id="stats-box" class="hud-box"></div>
  </div>
  <aside id="main-panel" class="panel">
    <div class="panel-header">
      <span>3.875D Editor Pro</span>
      <span id="sel-badge" style="font-size:10px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px;">未選択</span>
    </div>
    <div id="tab-bar" class="tabs"></div>
    <div id="panel-body" class="panel-body"></div>
  </aside>
  <div id="toolbar" class="toolbar"></div>
  <div id="help-modal" class="modal">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong>ショートカット &amp; クイック操作</strong>
        <button id="close-help">閉じる</button>
      </div>
      <div style="line-height:1.75;color:var(--muted);font-size:12px;">
        <div><b>クリック / タップ:</b> オブジェクト選択（Shiftで複数選択）</div>
        <div><b>W / E / R:</b> 移動 / 回転 / 拡大縮小モード</div>
        <div><b>Q:</b> ワールド / ローカル座標切替 | <b>F:</b> フォーカス</div>
        <div><b>Ctrl+Z / Y:</b> 元に戻す / やり直す | <b>Ctrl+D:</b> 複製</div>
        <div><b>Ctrl+C / V:</b> コピー / ペースト | <b>Ctrl+A:</b> 全選択</div>
        <div><b>Esc:</b> 選択解除 | <b>Delete:</b> 削除</div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
